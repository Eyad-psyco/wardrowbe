name: Deploy VPS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to OVH VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            # Matches the running stack: default docker-compose.yml (frontend :80).
            # --force-recreate is required: compose often keeps old containers when
            # only the :latest image digest changed under the same tag.
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T backend alembic upgrade head
