name: Deploy VPS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to OVH VPS
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy path
        id: path
        env:
          FROM_VAR: ${{ vars.VPS_DEPLOY_PATH }}
          FROM_SECRET: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          path="${FROM_VAR:-$FROM_SECRET}"
          if [ -z "$path" ]; then
            echo "::error::VPS_DEPLOY_PATH is empty. Add a repository Variable (or Secret) named VPS_DEPLOY_PATH, e.g. /home/debian/wardrowbe"
            exit 1
          fi
          echo "value=$path" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ steps.path.outputs.value }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            # Matches the running stack: default docker-compose.yml (frontend :80).
            # --force-recreate is required: compose often keeps old containers when
            # only the :latest image digest changed under the same tag.
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T backend alembic upgrade head
